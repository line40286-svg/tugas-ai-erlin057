<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembeda Angka 5 dan 3</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; text-align: center; color: #222; }
    h1 { font-size: 1.5rem; }
    button { padding: 10px 20px; font-size: 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; margin: 6px; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #webcam-container, #preview-container { margin: 16px auto; min-height: 20px; }
    #preview-container img { max-width: 224px; max-height: 224px; border: 1px solid #ccc; }
    .bar-row { display: flex; align-items: center; margin: 8px 0; text-align: left; }
    .bar-label { width: 60px; font-weight: bold; font-size: 1.2rem; }
    .bar-bg { flex: 1; background: #e5e7eb; border-radius: 6px; height: 24px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0; background: #16a34a; transition: width 0.1s; }
    .bar-pct { width: 60px; text-align: right; }
    #hasil { font-size: 1.3rem; font-weight: bold; margin-top: 16px; }
    #status { color: #555; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Pembeda Angka 5 dan 3</h1>
  <p>Model dibuat dengan Teachable Machine (TensorFlow.js)</p>

  <button id="btn-webcam" onclick="startWebcam()">Mulai Webcam</button>
  <button id="btn-stop" onclick="stopWebcam()" disabled>Hentikan</button>
  <br>
  <label>atau upload gambar: <input type="file" id="file-input" accept="image/*"></label>

  <div id="status">Memuat model...</div>
  <div id="webcam-container"></div>
  <div id="preview-container"></div>

  <div id="label-container"></div>
  <div id="hasil"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    // Folder model hasil export Teachable Machine (model.json, metadata.json, weights.bin)
    const MODEL_URL = "./my_model/model.json";
    const METADATA_URL = "./my_model/metadata.json";

    let model, webcam, maxPredictions, running = false;
    const labelContainer = document.getElementById("label-container");
    const statusEl = document.getElementById("status");
    const hasilEl = document.getElementById("hasil");

    async function loadModel() {
      try {
        model = await tmImage.load(MODEL_URL, METADATA_URL);
        maxPredictions = model.getTotalClasses();
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          labelContainer.insertAdjacentHTML("beforeend",
            '<div class="bar-row"><div class="bar-label"></div>' +
            '<div class="bar-bg"><div class="bar-fill"></div></div>' +
            '<div class="bar-pct">0%</div></div>');
        }
        statusEl.textContent = "Model siap. Mulai webcam atau upload gambar.";
      } catch (e) {
        statusEl.textContent = "Gagal memuat model. Pastikan folder my_model ada dan web dijalankan lewat server (Live Server / GitHub Pages).";
        console.error(e);
      }
    }

    function tampilkan(prediction) {
      let terbaik = prediction[0];
      for (let i = 0; i < maxPredictions; i++) {
        const row = labelContainer.children[i];
        const persen = (prediction[i].probability * 100).toFixed(0);
        row.querySelector(".bar-label").textContent = prediction[i].className;
        row.querySelector(".bar-fill").style.width = persen + "%";
        row.querySelector(".bar-pct").textContent = persen + "%";
        if (prediction[i].probability > terbaik.probability) terbaik = prediction[i];
      }
      hasilEl.textContent = "Terdeteksi: angka " + terbaik.className +
        " (" + (terbaik.probability * 100).toFixed(0) + "%)";
    }

    async function startWebcam() {
      if (!model) return;
      document.getElementById("preview-container").innerHTML = "";
      webcam = new tmImage.Webcam(300, 300, true);
      await webcam.setup();
      await webcam.play();
      running = true;
      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("webcam-container").appendChild(webcam.canvas);
      document.getElementById("btn-webcam").disabled = true;
      document.getElementById("btn-stop").disabled = false;
      statusEl.textContent = "Arahkan kertas bertuliskan angka ke kamera.";
      window.requestAnimationFrame(loop);
    }

    async function loop() {
      if (!running) return;
      webcam.update();
      const prediction = await model.predict(webcam.canvas);
      tampilkan(prediction);
      window.requestAnimationFrame(loop);
    }

    function stopWebcam() {
      running = false;
      if (webcam) webcam.stop();
      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("btn-webcam").disabled = false;
      document.getElementById("btn-stop").disabled = true;
    }

    document.getElementById("file-input").addEventListener("change", (ev) => {
      const file = ev.target.files[0];
      if (!file || !model) return;
      stopWebcam();
      const img = new Image();
      img.onload = async () => {
        const box = document.getElementById("preview-container");
        box.innerHTML = "";
        box.appendChild(img);
        const prediction = await model.predict(img);
        tampilkan(prediction);
      };
      img.src = URL.createObjectURL(file);
    });

    loadModel();
  </script>
</body>
</html>
